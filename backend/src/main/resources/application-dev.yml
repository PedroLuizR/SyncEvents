spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/syncevents}
    username: ${DB_USER:syncevents}
    password: ${DB_PASSWORD:syncevents}

logging:
  level:
    br.com.syncevents: DEBUG

app:
  jwt:
    # só para desenvolvimento local; fora do perfil dev, APP_JWT_SECRET é obrigatório
    segredo: ${APP_JWT_SECRET:dev-segredo-local-syncevents-troque-em-producao-0123456789}
