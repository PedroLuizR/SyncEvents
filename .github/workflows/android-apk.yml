# Gera o APK de release do app e publica numa Release do GitHub.
# Roda a cada push na main que mexa no app, ou manualmente em Actions → "APK Android" → Run workflow.
name: APK Android

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Endereço padrão do backend embutido no APK (pode ser trocado no app, na tela Servidor)"
        required: false
        default: "https://syncevents-production.up.railway.app"

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'https://syncevents-production.up.railway.app' }}
      VERSAO: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); só aceitamos as licenças.
      - name: Android SDK
        working-directory: .
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # versões exigidas pelo React Native 0.88 (node_modules/react-native/gradle/libs.versions.toml)
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006" 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log" | tail -5

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Testes, tipos e lint
        run: |
          set -o pipefail
          npm test -- --ci 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log" | tail -20
          npm run typecheck 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          npm run lint 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Gerar o projeto Android (expo prebuild)
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install --clean 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Compilar o APK de release
        working-directory: mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 \
            2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Renomear o APK
        id: apk
        run: |
          NOME="SyncEvents-v${VERSAO}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "../$NOME"
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          ls -lh "../$NOME"

      # Em caso de falha, publica o fim do log como anotações (visíveis sem abrir o log completo)
      - name: Resumo do erro
        if: failure()
        working-directory: .
        run: |
          touch build.log
          grep -nE "FAILURE|What went wrong|error:|Error:|ERROR|Could not|failed" build.log | tail -15 > erros.txt || true
          while IFS= read -r linha; do echo "::error title=Linha do log::${linha:0:900}"; done < erros.txt
          tail -c 3000 build.log | tr '\n' ' ' | fold -w 900 | tail -4 | while IFS= read -r t; do echo "::error title=Fim do log::$t"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nome }}
          path: ${{ steps.apk.outputs.nome }}
          retention-days: 30

      - name: Publicar a Release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notas.md <<NOTAS
          APK de teste do SyncEvents **v${VERSAO}** (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}).

          **Como instalar:** baixe o arquivo \`.apk\` abaixo no celular (ou arraste para o emulador) e permita a instalação de apps desta fonte.

          **Backend:** o app já vem apontando para \`${EXPO_PUBLIC_API_URL}\` (backend na nuvem, sempre ativo).
          Para usar um backend local, toque em **"Servidor: ... · alterar"** na tela de boas-vindas
          (emulador: \`10.0.2.2:8080\`; celular: o IP do computador, por exemplo \`192.168.0.10:8080\`).

          **Contas de demonstração** (senha \`Senha@123\`): cliente \`marina@demo.syncevents.com\` · empresa \`contato@aurora.demo.syncevents.com\`.
          NOTAS
          gh release create "build-${{ github.run_number }}" "${{ steps.apk.outputs.nome }}" \
            --title "SyncEvents v${VERSAO} (build ${{ github.run_number }})" \
            --notes-file notas.md --target "$GITHUB_SHA" --latest
