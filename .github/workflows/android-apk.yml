# Gera o APK de release do app e publica numa Release do GitHub.
# Roda a cada push na main que mexa no app, ou manualmente em Actions → "APK Android" → Run workflow.
name: APK Android

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      api_url:
        description: "Endereço padrão do backend embutido no APK (pode ser trocado no app, na tela Servidor)"
        required: false
        default: "http://10.0.2.2:8080"

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ github.event.inputs.api_url || 'http://10.0.2.2:8080' }}
      VERSAO: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); só aceitamos as licenças.
      - name: Android SDK
        working-directory: .
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}

      - name: Instalar dependências
        run: npm ci

      - name: Testes, tipos e lint
        run: |
          npm test -- --ci
          npm run typecheck
          npm run lint

      - name: Gerar o projeto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar o APK de release
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Renomear o APK
        id: apk
        run: |
          NOME="SyncEvents-v${VERSAO}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "../$NOME"
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          ls -lh "../$NOME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nome }}
          path: ${{ steps.apk.outputs.nome }}
          retention-days: 30

      - name: Publicar a Release
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notas.md <<NOTAS
          APK de teste do SyncEvents **v${VERSAO}** (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}).

          **Como instalar:** baixe o arquivo \`.apk\` abaixo no celular (ou arraste para o emulador) e permita a instalação de apps desta fonte.

          **Backend:** o app precisa do backend rodando (veja o README: \`docker compose up -d\`).
          O endereço padrão é \`${EXPO_PUBLIC_API_URL}\` (emulador Android). Num celular, toque em **"Servidor: ... · alterar"**
          na tela de boas-vindas e informe o IP do computador, por exemplo \`192.168.0.10:8080\`.

          **Contas de demonstração** (senha \`Senha@123\`): cliente \`marina@demo.syncevents.com\` · empresa \`contato@aurora.demo.syncevents.com\`.
          NOTAS
          gh release create "build-${{ github.run_number }}" "${{ steps.apk.outputs.nome }}" \
            --title "SyncEvents v${VERSAO} (build ${{ github.run_number }})" \
            --notes-file notas.md --target "$GITHUB_SHA" --latest
