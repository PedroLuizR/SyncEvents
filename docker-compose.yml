services:
  postgres:
    image: postgres:16-alpine
    container_name: syncevents-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-syncevents}
      POSTGRES_USER: ${DB_USER:-syncevents}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-syncevents}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-syncevents} -d ${DB_NAME:-syncevents}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend (perfil dev: migrations + dados de demonstração). Para rodar pelo Maven, suba só o postgres.
  backend:
    build: ./backend
    image: syncevents-backend
    container_name: syncevents-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-syncevents}
      DB_USER: ${DB_USER:-syncevents}
      DB_PASSWORD: ${DB_PASSWORD:-syncevents}
      APP_STORAGE_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  # Opcional: docker compose --profile tools up -d  →  http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: syncevents-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@syncevents.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  uploads:
